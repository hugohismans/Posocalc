<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posocalc</title>
<meta name="description" content="Outil d'aide au calcul de posologie pédiatrique en fonction du poids, pour les médicaments disponibles en Belgique. Version de développement.">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
</head>
<body>

<!-- ============================ Avertissement initial ============ -->
<div class="modal" id="modal-disclaimer" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
    <h2 id="modal-titre"></h2>
    <div id="modal-corps"></div>
    <button class="btn btn--primary btn--block" id="btn-accepter"></button>
  </div>
</div>

<!-- ============================ En-tête ========================== -->
<header class="entete">
  <div class="conteneur entete__interne">
    <a class="logo" href="#/">
      <span class="logo__marque">Posocalc <span class="badge badge--dev" id="badge-dev"></span></span>
      <span class="logo__sous" id="logo-sous"></span>
    </a>
    <div class="entete__actions">
      <button class="btn btn--fantome btn--petit" id="btn-langue" type="button"></button>
      <button class="btn btn--fantome btn--petit" id="btn-info" type="button"></button>
    </div>
  </div>
</header>

<div class="bandeau" id="bandeau" role="note"></div>

<main class="conteneur">

  <!-- ======================== Étape 1 : patient =================== -->
  <section class="carte carte--patient" aria-labelledby="t-patient">
    <h2 class="carte__titre" id="t-patient"></h2>
    <div class="grille-patient">
      <div class="champ champ--majeur">
        <label for="poids" id="lbl-poids"></label>
        <div class="champ__saisie">
          <input type="number" id="poids" inputmode="decimal" step="0.1" min="0.5" max="120" placeholder="12,0" autocomplete="off">
          <span class="champ__unite">kg</span>
        </div>
      </div>
      <div class="champ">
        <label for="age-valeur" id="lbl-age"></label>
        <div class="champ__saisie">
          <input type="number" id="age-valeur" inputmode="numeric" step="1" min="0" max="200" placeholder="3" autocomplete="off">
          <select id="age-unite" aria-label="Unité d’âge">
            <option value="ans" id="opt-ans"></option>
            <option value="mois" id="opt-mois"></option>
          </select>
        </div>
      </div>
      <div class="champ">
        <label for="prenom" id="lbl-prenom"></label>
        <div class="champ__saisie">
          <input type="text" id="prenom" autocomplete="off" maxlength="40">
        </div>
      </div>
      <button class="btn btn--fantome btn--petit" id="btn-reset" type="button"></button>
    </div>
    <p class="carte__aide" id="aide-patient"></p>
  </section>

  <!-- ======================== Étape 2 : médicament ================ -->
  <section class="carte" aria-labelledby="t-med" id="section-liste">
    <h2 class="carte__titre" id="t-med"></h2>

    <div class="recherche">
      <svg class="recherche__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 19a8 8 0 110-16 8 8 0 010 16z"/></svg>
      <input type="search" id="recherche" autocomplete="off">
      <button class="recherche__vider" id="btn-vider-recherche" type="button" hidden>&times;</button>
    </div>

    <div class="filtres" id="filtres" role="group"></div>

    <p class="liste__entete" id="liste-entete"></p>
    <ul class="liste" id="liste"></ul>
    <p class="vide" id="liste-vide" hidden></p>
  </section>

  <!-- ======================== Étape 3 : résultat ================== -->
  <section id="detail" class="detail" hidden aria-live="polite"></section>

  <!-- ======================== Coordonnées prescripteur ============ -->
  <details class="carte carte--medecin">
    <summary id="t-medecin"></summary>
    <p class="carte__aide" id="aide-medecin"></p>
    <div class="grille-medecin">
      <div class="champ"><label for="md-nom" id="lbl-md-nom"></label>
        <div class="champ__saisie"><input type="text" id="md-nom" autocomplete="off"></div></div>
      <div class="champ"><label for="md-qualif" id="lbl-md-qualif"></label>
        <div class="champ__saisie"><input type="text" id="md-qualif" autocomplete="off"></div></div>
      <div class="champ"><label for="md-inami" id="lbl-md-inami"></label>
        <div class="champ__saisie"><input type="text" id="md-inami" autocomplete="off"></div></div>
      <div class="champ"><label for="md-tel" id="lbl-md-tel"></label>
        <div class="champ__saisie"><input type="tel" id="md-tel" autocomplete="off"></div></div>
      <div class="champ champ--large"><label for="md-adresse" id="lbl-md-adresse"></label>
        <div class="champ__saisie"><input type="text" id="md-adresse" autocomplete="off"></div></div>
    </div>

    <div class="logo-reglage">
      <span class="logo-reglage__titre" id="lbl-md-logo"></span>
      <p class="carte__aide" id="aide-logo"></p>
      <div class="logo-reglage__ligne">
        <label class="btn btn--fantome btn--petit" for="md-logo" id="lbl-logo-choisir"></label>
        <input type="file" id="md-logo" accept="image/*" hidden>
        <button class="btn btn--fantome btn--petit" id="btn-logo-retirer" type="button" hidden></button>
      </div>
      <div class="logo-apercu" id="logo-apercu" hidden><img id="logo-img" alt=""></div>
    </div>

    <button class="btn btn--fantome btn--petit" id="btn-md-save" type="button"></button>
  </details>

</main>

<footer class="pied">
  <div class="conteneur">
    <p id="pied-projet"></p>
    <p><span id="pied-sources-lbl"></span> :
       <a href="https://www.cbip.be/fr/start" target="_blank" rel="noopener">CBIP</a> ·
       <a href="https://www.bcfi.be/nl/start" target="_blank" rel="noopener">BCFI</a> ·
       <a href="https://organesdeconcertation.sante.belgique.be/sites/default/files/content/bapcoc_guide_traitement_antiinfectieux_2022.pdf" target="_blank" rel="noopener">BAPCOC</a> ·
       <a href="https://www.afmps.be/fr" target="_blank" rel="noopener">AFMPS / FAGG</a></p>
    <p class="pied__legal" id="pied-legal"></p>
  </div>
</footer>

<!-- ============================ Aperçu / feuille patient ========= -->
<div class="apercu" id="apercu" hidden>
  <div class="apercu__box" role="dialog" aria-modal="true" aria-labelledby="apercu-titre">
    <div class="apercu__barre">
      <h2 id="apercu-titre"></h2>
      <div class="apercu__actions">
        <button class="btn btn--primary btn--petit" id="btn-apercu-imprimer" type="button"></button>
        <button class="btn btn--fantome btn--petit" id="btn-apercu-fermer" type="button"></button>
      </div>
    </div>
    <div class="feuille" id="feuille"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/calc.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
